<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>先停一下</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#11110f;color:#f4f0e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.card{width:min(100%,480px);padding:30px;border:1px solid rgba(244,240,232,.14);border-radius:24px;background:#1a1916}.dot{width:10px;height:10px;border-radius:50%;background:#eaa84f;box-shadow:0 0 0 8px rgba(234,168,79,.1)}h1{margin:28px 0 14px;font-size:42px;letter-spacing:-.05em;line-height:1.05}p{color:#a8a39a;line-height:1.8}button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;background:#eaa84f;color:#17130e;font-weight:700;font-size:15px}
  </style>
</head>
<body><main class="card"><div class="dot"></div><h1>没网也没关系，<br>先停 90 秒。</h1><p>把手机放下，慢慢呼气。冲动可以存在，但它不是命令。网络恢复后刷新即可继续。</p><button onclick="location.reload()">重新连接</button></main></body>
</html>
