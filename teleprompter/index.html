<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>声控提词器 · 稳定版</title>
<style>
  :root{
    --bg:#070707;
    --panel:#111;
    --line:#252525;
    --text:#f5f5f5;
    --muted:#8f8f8f;
    --accent:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  button,textarea,input{font:inherit}
  body{overflow:hidden}
  .app{height:100%;display:flex;flex-direction:column}
  .topbar{
    height:64px;flex:none;display:flex;align-items:center;gap:12px;
    padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,7,7,.92);backdrop-filter:blur(14px);z-index:10
  }
  .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .spacer{flex:1}
  .status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;box-shadow:0 0 0 0 rgba(255,255,255,0)}
  .dot.live{background:#fff;animation:pulse 1.5s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .btn{
    border:1px solid #303030;background:#151515;color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;
  }
  .btn:hover{background:#1d1d1d}
  .btn.primary{background:#fff;color:#080808;border-color:#fff;font-weight:700}
  .btn.primary:hover{background:#e9e9e9}
  .btn.danger{border-color:#3a2020;color:#ffb1b1}
  .workspace{min-height:0;flex:1;display:grid;grid-template-columns:340px 1fr}
  .sidebar{
    min-width:0;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;background:#0b0b0b;overflow:auto
  }
  .label{font-size:12px;color:var(--muted);margin-bottom:7px}
  textarea{
    width:100%;min-height:260px;resize:vertical;background:#101010;color:#eee;border:1px solid #262626;border-radius:14px;
    padding:14px;outline:none;line-height:1.65
  }
  textarea:focus{border-color:#555}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
  input[type=range]{width:100%}
  .value{font-size:12px;color:#bdbdbd;min-width:48px;text-align:right}
  .hint{font-size:12px;line-height:1.6;color:#777}
  .stage{min-width:0;position:relative;overflow:hidden;background:#050505}
  .guide{
    position:absolute;z-index:4;left:0;right:0;top:48%;
    height:2px;background:rgba(255,255,255,.12);pointer-events:none
  }
  .maskTop,.maskBottom{position:absolute;left:0;right:0;height:24%;z-index:3;pointer-events:none}
  .maskTop{top:0;background:linear-gradient(#050505 10%,rgba(5,5,5,0))}
  .maskBottom{bottom:0;background:linear-gradient(rgba(5,5,5,0),#050505 90%)}
  .teleprompter{
    position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;padding:45vh max(8vw,28px) 50vh;
    scrollbar-width:none
  }
  .teleprompter::-webkit-scrollbar{display:none}
  .script{
    user-select:none;-webkit-user-select:none;
    max-width:1100px;margin:0 auto;font-size:44px;line-height:1.7;font-weight:650;letter-spacing:.01em;
    white-space:pre-wrap;word-break:break-word;color:#6f6f6f
  }
  .chunk{transition:color .22s ease,opacity .22s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chunk.past{color:#333}
  .chunk.current{color:#fff;text-shadow:0 0 24px rgba(255,255,255,.08)}
  .chunk.future{color:#737373}
  .empty{
    height:100%;display:flex;align-items:center;justify-content:center;color:#555;text-align:center;padding:40px;font-size:18px;line-height:1.8
  }
  .bottomTip{
    position:absolute;right:18px;bottom:14px;z-index:5;color:#666;font-size:12px;background:rgba(5,5,5,.7);padding:8px 10px;border-radius:10px
  }
  .transcript{
    font-size:12px;color:#9b9b9b;background:#0f0f0f;border:1px solid #242424;border-radius:12px;padding:10px 12px;min-height:42px;line-height:1.5
  }
  @media(max-width:850px){
    .workspace{grid-template-columns:1fr}
    .sidebar{position:absolute;z-index:20;left:10px;right:10px;top:74px;max-height:70vh;border:1px solid #2a2a2a;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.45);display:none}
    .sidebar.open{display:flex}
    .script{font-size:38px}
    .topbar{padding:0 10px}
    .brand{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">声控提词器</div>
    <button id="settingsBtn" class="btn">稿件 / 设置</button>
    <div class="spacer"></div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">未启动</span></div>
    <button id="startBtn" class="btn primary">开始声控</button>
    <button id="resetBtn" class="btn">回到开头</button>
  </header>

  <main class="workspace">
    <aside id="sidebar" class="sidebar">
      <div>
        <div class="label">提词稿</div>
        <textarea id="scriptInput" placeholder="把你的口播稿粘贴到这里……">如果你的生活是一部电影，观众看到你现在这个阶段，他们会对着屏幕大喊什么？

很多时候，我们站在别人的人生外面看，答案其实特别明显。

但轮到自己，我们总觉得还要再等等，再准备一下，再想清楚一点。

可问题是，生活永远不会等到所有问题都消失以后才开始。

你正在犹豫、等待、尝试、犯错的这些日子，本身就是你的生活。

所以别把人生当成一道必须答对的题。

先往前走。答案很多时候，是走出来的。</textarea>
      </div>

      <div>
        <div class="label">字体大小</div>
        <div class="row">
          <input id="fontSize" type="range" min="28" max="76" value="44"/>
          <div id="fontSizeValue" class="value">44 px</div>
        </div>
      </div>

      <div>
        <div class="label">行距</div>
        <div class="row">
          <input id="lineHeight" type="range" min="1.25" max="2.1" value="1.7" step="0.05"/>
          <div id="lineHeightValue" class="value">1.70</div>
        </div>
      </div>

      <div>
        <div class="label">跟随灵敏度</div>
        <div class="row">
          <input id="sensitivity" type="range" min="1" max="5" value="3"/>
          <div id="sensitivityValue" class="value">3 / 5</div>
        </div>
      </div>

      <div>
        <div class="label">实时识别</div>
        <div id="transcript" class="transcript">启动后，这里会显示你刚刚说的话。</div>
      </div>

      <button id="applyBtn" class="btn">应用稿件</button>
      <button id="fullscreenBtn" class="btn">全屏</button>
      <div class="hint">
        推荐 Chrome / Edge。首次使用请允许麦克风权限。<br>
        单向跟随：自动识别只会从当前句进入下一句，不会跳回已经读过的句子。需要回退时，直接点击那一句。
      </div>
    </aside>

    <section class="stage">
      <div class="guide"></div>
      <div class="maskTop"></div>
      <div class="maskBottom"></div>
      <div id="teleprompter" class="teleprompter">
        <div id="emptyState" class="empty" style="display:none">先在“稿件 / 设置”里粘贴文字，然后点“开始声控”。</div>
        <div id="script" class="script"></div>
      </div>
      <div class="bottomTip">Space：开始/暂停 · ↑↓：手动微调</div>
    </section>
  </main>
</div>

<script>
(() => {
  const els = {
    scriptInput: document.getElementById('scriptInput'),
    script: document.getElementById('script'),
    emptyState: document.getElementById('emptyState'),
    teleprompter: document.getElementById('teleprompter'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
    applyBtn: document.getElementById('applyBtn'),
    fullscreenBtn: document.getElementById('fullscreenBtn'),
    settingsBtn: document.getElementById('settingsBtn'),
    sidebar: document.getElementById('sidebar'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    transcript: document.getElementById('transcript'),
    fontSize: document.getElementById('fontSize'),
    fontSizeValue: document.getElementById('fontSizeValue'),
    lineHeight: document.getElementById('lineHeight'),
    lineHeightValue: document.getElementById('lineHeightValue'),
    sensitivity: document.getElementById('sensitivity'),
    sensitivityValue: document.getElementById('sensitivityValue'),
  };

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let rawScript = '';
  let normalizedScript = '';
  let normToRaw = [];
  let chunks = [];
  let currentNormIndex = 0;
  let currentChunkIndex = 0;
  let currentChunkProgress = 0;
  let restartTimer = null;
  let lastMoveAt = 0;

  function normalizeChar(ch){
    if (/[\u4e00-\u9fffA-Za-z0-9]/.test(ch)) return ch.toLowerCase();
    return '';
  }

  function buildNormalized(text){
    normalizedScript = '';
    normToRaw = [];
    for(let i=0;i<text.length;i++){
      const c = normalizeChar(text[i]);
      if(c){
        normalizedScript += c;
        normToRaw.push(i);
      }
    }
  }

  function chunkScript(text){
    const parts = text.split(/(?<=[。！？!?；;，,])|(\n+)/g).filter(Boolean);
    let rawPos = 0;
    const result = [];
    for(const part of parts){
      const start = rawPos;
      rawPos += part.length;
      const end = rawPos;
      result.push({text:part,start,end,norm:[...part].map(normalizeChar).join(''),el:null});
    }
    return result;
  }

  function renderScript(){
    rawScript = els.scriptInput.value.trim();
    els.script.innerHTML = '';
    els.emptyState.style.display = rawScript ? 'none' : 'flex';
    if(!rawScript) return;
    buildNormalized(rawScript);
    chunks = chunkScript(rawScript);
    chunks.forEach((chunk, i) => {
      const span = document.createElement('span');
      span.className = 'chunk future';
      span.dataset.index = i;
      span.textContent = chunk.text;
      chunk.el = span;
      span.addEventListener('click', () => setChunk(i, 0, true));
      els.script.appendChild(span);
    });
    currentNormIndex = 0;
    currentChunkIndex = 0;
    currentChunkProgress = 0;
    updateHighlight(0, false);
    els.teleprompter.scrollTop = 0;
    localStorage.setItem('voiceTeleprompterScript', rawScript);
  }

  function updateHighlight(_normIndex, shouldScroll=true){
    const currentChunk = Math.max(0, Math.min(chunks.length - 1, currentChunkIndex));
    chunks.forEach((chunk, i) => {
      chunk.el.classList.remove('past','current','future');
      if(i < currentChunk) chunk.el.classList.add('past');
      else if(i === currentChunk) chunk.el.classList.add('current');
      else chunk.el.classList.add('future');
    });
    if(shouldScroll && chunks[currentChunk]?.el){
      const now = performance.now();
      if(now - lastMoveAt > 120){
        chunks[currentChunk].el.scrollIntoView({behavior:'smooth',block:'center'});
        lastMoveAt = now;
      }
    }
  }

  function setChunk(index, progress=0, shouldScroll=true){
    currentChunkIndex = Math.max(0, Math.min(chunks.length - 1, index));
    currentChunkProgress = Math.max(0, progress);
    updateHighlight(currentNormIndex, shouldScroll);
  }

  function allOccurrences(haystack, needle){
    const out=[];
    if(!needle) return out;
    let at=0;
    while(true){
      const pos=haystack.indexOf(needle, at);
      if(pos===-1) break;
      out.push(pos);
      at=pos+1;
    }
    return out;
  }

  function bestExactTailMatch(heard, text, minLen){
    const maxLen=Math.min(22, heard.length, text.length);
    for(let len=maxLen; len>=minLen; len--){
      const needle=heard.slice(-len);
      const positions=allOccurrences(text, needle);
      if(positions.length){
        return {len, pos:positions[positions.length-1] + len};
      }
    }
    return null;
  }

  function findSpeechPosition(transcript){
    const heard=[...transcript].map(normalizeChar).join('');
    if(!heard || !chunks.length) return null;
    const cur=chunks[currentChunkIndex];
    const next=chunks[currentChunkIndex + 1];
    if(!cur) return null;
    const curMatch=bestExactTailMatch(heard, cur.norm, 4);
    if(curMatch){
      currentChunkProgress=Math.max(currentChunkProgress, curMatch.pos);
    }
    if(next){
      const completion=cur.norm.length ? currentChunkProgress / cur.norm.length : 1;
      const required = completion >= 0.55 ? 5 : 8;
      const nextMatch=bestExactTailMatch(heard, next.norm, required);
      if(nextMatch){
        const curTail=cur.norm.slice(Math.max(0, cur.norm.length - 6));
        const hasBridge = curTail.length >= 4 && heard.includes(curTail);
        const strongNext = nextMatch.len >= 9;
        if(completion >= 0.55 || hasBridge || strongNext){
          currentChunkIndex += 1;
          currentChunkProgress = nextMatch.pos;
          updateHighlight(currentNormIndex, true);
          return {chunk: currentChunkIndex, progress: currentChunkProgress};
        }
      }
    }
    updateHighlight(currentNormIndex, false);
    return curMatch ? {chunk: currentChunkIndex, progress: currentChunkProgress} : null;
  }

  function setStatus(text, live=false){
    els.statusText.textContent = text;
    els.statusDot.classList.toggle('live', live);
  }

  function setupRecognition(){
    if(!SpeechRecognition){
      setStatus('浏览器不支持语音识别');
      els.startBtn.disabled = true;
      els.startBtn.textContent = '不支持';
      els.transcript.textContent = '请使用最新版 Chrome 或 Edge 打开。';
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => {
      listening = true;
      setStatus('正在听你说话', true);
      els.startBtn.textContent = '暂停声控';
    };
    recognition.onresult = (event) => {
      let interim = '';
      let finalText = '';
      for(let i=event.resultIndex;i<event.results.length;i++){
        const text = event.results[i][0].transcript;
        if(event.results[i].isFinal) finalText += text;
        else interim += text;
      }
      const spoken = (finalText || interim).trim();
      if(spoken){
        els.transcript.textContent = spoken;
        findSpeechPosition(spoken);
      }
    };
    recognition.onerror = (event) => {
      if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        listening = false;
        setStatus('麦克风权限被拒绝');
        els.startBtn.textContent = '重新授权';
        els.transcript.textContent = '请在浏览器地址栏左侧允许麦克风权限，然后再试。';
      }else if(event.error !== 'no-speech' && event.error !== 'aborted'){
        setStatus('识别中断');
        els.transcript.textContent = '语音识别暂时中断：' + event.error;
      }
    };
    recognition.onend = () => {
      if(listening){
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => { try{ recognition.start(); }catch(e){} }, 220);
      }else{
        setStatus('已暂停');
        els.startBtn.textContent = '开始声控';
      }
    };
  }

  function startStop(){
    if(!recognition) return;
    if(listening){
      listening = false;
      clearTimeout(restartTimer);
      try{ recognition.stop(); }catch(e){}
      setStatus('已暂停');
      els.startBtn.textContent = '开始声控';
    }else{
      if(!rawScript) renderScript();
      try{ recognition.start(); }
      catch(e){ setTimeout(()=>{ try{ recognition.start(); }catch(_){} }, 250); }
    }
  }

  els.startBtn.addEventListener('click', startStop);
  els.resetBtn.addEventListener('click', () => {
    currentNormIndex = 0;
    currentChunkIndex = 0;
    currentChunkProgress = 0;
    updateHighlight(0, false);
    els.teleprompter.scrollTo({top:0,behavior:'smooth'});
  });
  els.applyBtn.addEventListener('click', () => {
    renderScript();
    if(innerWidth <= 850) els.sidebar.classList.remove('open');
  });
  els.settingsBtn.addEventListener('click', () => els.sidebar.classList.toggle('open'));
  els.fullscreenBtn.addEventListener('click', async () => {
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  });
  els.fontSize.addEventListener('input', () => {
    els.script.style.fontSize = els.fontSize.value + 'px';
    els.fontSizeValue.textContent = els.fontSize.value + ' px';
  });
  els.lineHeight.addEventListener('input', () => {
    els.script.style.lineHeight = els.lineHeight.value;
    els.lineHeightValue.textContent = Number(els.lineHeight.value).toFixed(2);
  });
  els.sensitivity.addEventListener('input', () => {
    els.sensitivityValue.textContent = els.sensitivity.value + ' / 5';
  });
  document.addEventListener('keydown', (e) => {
    if(e.target === els.scriptInput) return;
    if(e.code === 'Space'){
      e.preventDefault();
      startStop();
    }else if(e.key === 'ArrowDown'){
      e.preventDefault();
      els.teleprompter.scrollBy({top:90,behavior:'smooth'});
    }else if(e.key === 'ArrowUp'){
      e.preventDefault();
      els.teleprompter.scrollBy({top:-90,behavior:'smooth'});
    }
  });
  const saved = localStorage.getItem('voiceTeleprompterScript');
  if(saved) els.scriptInput.value = saved;
  renderScript();
  setupRecognition();
})();
</script>
</body>
</html>
